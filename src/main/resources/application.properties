spring.application.name=docsearch
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/docsearch}
spring.datasource.username=${DATABASE_USER:docsearch}
spring.datasource.password=${DATABASE_PASSWORD:docsearch}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
